# Bootstrap Validation CI (AGENTS.md §4.1)
#
# Ruff, MyPy, Pytest 명령을 여기에 중복 정의하지 않는다.
# 모든 검증 로직은 scripts/dev.py 단일 진입점을 사용한다.
# run-mcp는 미구현(exit 2)이므로 CI에서 실행하지 않는다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Build
        run: uv run python scripts/dev.py build

      - name: Validate
        run: uv run python scripts/dev.py validate
