[project]
name = "imo-compendium-mapping-validator"
version = "0.1.0"
description = "IMO Compendium Registry mapping & validation skill (registry import module)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
